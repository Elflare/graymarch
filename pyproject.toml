[project]
name = "graymarch"
version = "0.1.0"
description = "Local HTTP bridge for Graymarch's authoritative browser game"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
graymarch = "graymarch_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graymarch_bridge"]

[dependency-groups]
dev = ["httpx>=0.28,<1"]
